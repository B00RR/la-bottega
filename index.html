<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c4844e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23c4844e' width='16' height='16'/%3E%3C/svg%3E" />
    <title>La Bottega</title>
    <style>
      :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
      html, body { margin: 0; height: 100%; background: #c4844e; }
      @font-face {
        font-family: Nunito;
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url("/la-bottega/font/nunito-800.woff2") format("woff2");
      }
      @font-face {
        font-family: Nunito;
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url("/la-bottega/font/nunito-900.woff2") format("woff2");
      }
      #saracinesca {
        position: fixed; inset: 0; z-index: 30; background:
          repeating-linear-gradient(#d29a62 0 6px, #e8b07a 6px 7px, #b57442 7px 14px);
        box-shadow: inset 0 0 0 24px #9a5f38;
        display: flex; align-items: flex-end; justify-content: center;
        transition: none; touch-action: none;
      }
      #vetrina {
        position: absolute; top: 22%; left: 40px; width: 64px; height: 88px;
        border: 8px solid #fff6ea; background: #fff6ea66;
        box-shadow: inset 0 0 0 3px #9a5f38; pointer-events: none;
      }
      #lama {
        position: absolute; left: 8%; right: 8%; bottom: -6px; height: 14px;
        background: #ffd59a; filter: blur(12px); border-radius: 999px;
        transform: scaleX(0.35); transform-origin: center;
        transition: transform 0.6s ease;
      }
      #saracinesca.pronta #lama { transform: scaleX(1); }
      #cartello {
        position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
        width: 300px; max-width: 86vw; height: 64px; margin: 0;
        background: #3c291c; color: #fff6ea; border-radius: 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: Nunito, "Trebuchet MS", sans-serif;
      }
      #cartello .nome { font-weight: 900; font-size: 28px; line-height: 1; }
      #cartello .sotto { font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #f0b86e; text-transform: lowercase; }
      #cartello.domani {
        top: 82%; width: auto; height: auto; padding: 14px 22px;
        background: #f4d2c0; color: #3c291c; font-weight: 900; font-size: 28px;
      }
      #maniglia {
        width: 168px; height: 52px; margin-bottom: calc(28px + var(--safe-bottom));
        background: #f0b86e; border-radius: 26px; box-shadow: 0 3px 0 #9a5f38;
        display: flex; align-items: center; justify-content: center;
        font: 800 18px Nunito, "Trebuchet MS", sans-serif; color: #3c291c;
      }
      #gesso { position: absolute; bottom: 22%; margin: 0; line-height: 0; }
    </style>
  </head>
  <body>
    <div id="app" data-pronto="0" data-input="1">
      <canvas id="vista"></canvas>
      <div id="saracinesca">
        <div id="lama"></div>
        <p id="cartello"><span class="nome">La Bottega</span><span class="sotto">riparazioni</span></p>
        <div id="vetrina" aria-hidden="true"></div>
        <p id="gesso" hidden>
          <svg viewBox="0 0 48 64" width="36" height="48" aria-hidden="true">
            <path d="M24 58 V12 M24 12 L12 26 M24 12 L36 26" fill="none" stroke="#fff6ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </p>
        <div id="maniglia">Alza</div>
      </div>
      <div id="chi-parla">
        <div id="medaglione" aria-hidden="true"></div>
        <p id="etichetta">Ettore</p>
      </div>
      <div id="bolla" hidden><p class="riga" aria-live="polite"></p></div>
      <div id="cartoncino" hidden>RIPARATO</div>
      <div id="punto-aiuto" hidden></div>
      <div id="mano-aiuto" hidden>
        <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
          <path fill="#f4d2c0" stroke="#3c291c" stroke-width="2" d="M18 28 V16 a4 4 0 0 1 8 0 V26 M26 24 V12 a4 4 0 0 1 8 0 V26 M34 24 V16 a4 4 0 0 1 8 0 V34 c0 12-8 18-16 18 h-4 c-8 0-14-6-14-14 v-8 a4 4 0 0 1 8 0 V28"/>
        </svg>
      </div>
      <div id="lente-ui" hidden><canvas width="256" height="256"></canvas></div>
      <div id="indizio-volo" hidden></div>
      <button id="ingranaggio" type="button" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 3 v3 M12 18 v3 M3 12 h3 M18 12 h3 M5.6 5.6 l2 2 M16.4 16.4 l2 2 M18.4 5.6 l-2 2 M7.6 16.4 l-2 2"/>
        </svg>
      </button>
      <section id="cassetta" hidden>
        <button id="taccuino-btn" type="button" aria-label="Taccuino" hidden>
          <svg viewBox="0 0 24 32" width="22" height="30" aria-hidden="true"><path d="M5 2 h12 a2 2 0 0 1 2 2 v24 H7 a2 2 0 0 0-2 2 z" fill="#e9d9be" stroke="#3c291c" stroke-width="1.4"/><path d="M5 2 v26" stroke="#8fbfa8" stroke-width="3"/><path d="M9 9 h7 M9 14 h7 M9 19 h5" stroke="#3c291c" stroke-width="1.4"/></svg>
        </button>
        <div class="attrezzi"></div>
      </section>
      <section id="taccuino" hidden>
        <div class="pagine">
          <ul id="lista-indizi"></ul>
          <p class="timbro-pagina">RIPARATO</p>
        </div>
        <button id="chiudi-taccuino" type="button">Chiudi</button>
      </section>
      <section id="impostazioni" hidden>
        <button id="audio-toggle" type="button" aria-pressed="true">Audio acceso</button>
        <button id="movimento" type="button" aria-pressed="false">Riduci movimento</button>
        <button id="testo" type="button" aria-pressed="false">Testo più grande</button>
        <button id="chiudi-imp" type="button">Chiudi</button>
        <button id="salta" type="button">Salta tutorial</button>
        <p id="timbro"></p>
      </section>
      <div id="azioni" hidden>
        <button id="continua" type="button">Continua domani</button>
        <button id="rigioca" type="button">Rigioca</button>
      </div>
      <div id="paesaggio" hidden><div class="sagoma"></div></div>
      <div id="zone-debug" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
